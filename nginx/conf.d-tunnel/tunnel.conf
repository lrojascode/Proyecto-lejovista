# ═══ LejoVista — Nginx para túnel (ngrok/Cloudflare Tunnel) ═══
#
# Un solo hostname (el que da el túnel gratuito) ruteado por PATH en vez de
# por subdominio: /api y /ws van al backend, todo lo demás al frontend. Evita
# depender de subdominios comodín (que ngrok gratis no da) — ver
# posibles-mejoras.md / HANDOFF para el detalle de por qué se eligió esto.
#
# No reemplaza a default.conf ni a production.conf.example: se monta en su
# lugar solo vía docker-compose.tunnel.yml (override), nunca en el compose
# normal de desarrollo.

server {
    listen 80 default_server;
    server_name _;

    # WebSocket de notificaciones (ver backend/app/api/v1/ws.py, prefix "/ws").
    # Ningún otro conf de este proyecto tenía las cabeceras de upgrade — sin
    # esto la conexión WS se cae silenciosamente detrás del túnel.
    location /ws/ {
        proxy_pass http://backend:8000/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }

    # API REST (ver backend/app/main.py, prefix "/api/v1").
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Todo lo demás: la app Next.js.
    location / {
        proxy_pass http://frontend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
