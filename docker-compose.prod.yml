# Producción (VPS): NO se construye nada aquí. Las imágenes se compilan en tu
# máquina (./build-push.sh) y se publican en el registry; el VPS solo hace pull.
#   docker compose -f docker-compose.prod.yml pull
#   docker compose -f docker-compose.prod.yml up -d
#
# IMAGE_PREFIX / IMAGE_TAG se leen del .env (o del entorno). Por defecto GHCR.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD} --maxmemory 256mb
    volumes:
      - redis_data:/data

  backend:
    # Imagen única construida y publicada con ./build-push.sh. Los workers y beat
    # reutilizan exactamente esta misma imagen (solo cambia el command).
    image: ${IMAGE_PREFIX:-ghcr.io/lrojascode}/proyectolejovista-backend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    env_file: .env
    # En producción no mapeamos puertos al host por seguridad (acceso solo via Nginx proxy)
    expose:
      - "8000"

  # I-2: colas dedicadas (sync/ai/creation) — ver app/workers/celery_app.py (task_routes)
  # y la nota equivalente en docker-compose.yml.
  celery-worker-sync:
    image: ${IMAGE_PREFIX:-ghcr.io/lrojascode}/proyectolejovista-backend:${IMAGE_TAG:-latest}
    command: celery -A app.workers worker -Q sync --loglevel=info --concurrency=2 --hostname=sync@%h
    restart: unless-stopped
    depends_on:
      - backend
    env_file: .env

  celery-worker-ai:
    image: ${IMAGE_PREFIX:-ghcr.io/lrojascode}/proyectolejovista-backend:${IMAGE_TAG:-latest}
    command: celery -A app.workers worker -Q ai --loglevel=info --concurrency=1 --hostname=ai@%h
    restart: unless-stopped
    depends_on:
      - backend
    env_file: .env

  celery-worker-creation:
    image: ${IMAGE_PREFIX:-ghcr.io/lrojascode}/proyectolejovista-backend:${IMAGE_TAG:-latest}
    command: celery -A app.workers worker -Q creation,celery --loglevel=info --concurrency=1 --hostname=creation@%h
    restart: unless-stopped
    depends_on:
      - backend
    env_file: .env

  celery-beat:
    image: ${IMAGE_PREFIX:-ghcr.io/lrojascode}/proyectolejovista-backend:${IMAGE_TAG:-latest}
    command: celery -A app.workers beat --loglevel=info --schedule=/tmp/celerybeat-schedule
    restart: unless-stopped
    depends_on:
      - celery-worker-sync
      - celery-worker-ai
      - celery-worker-creation
    env_file: .env

  frontend:
    image: ${IMAGE_PREFIX:-ghcr.io/lrojascode}/proyectolejovista-frontend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      - backend
    # OJO: las NEXT_PUBLIC_* del cliente se inlinean en build (con el BASE_DOMAIN
    # de prod, ver build-push.sh). Esta env solo cubre lectura server-side.
    environment:
      NEXT_PUBLIC_BASE_DOMAIN: ${BASE_DOMAIN}
    expose:
      - "3000"

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    depends_on:
      - frontend
      - backend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # Montamos el archivo de config de producción directamente como default.conf
      - ./nginx/conf.d/production.conf.example:/etc/nginx/conf.d/default.conf:ro
      # Montamos la carpeta de certificados de Certbot del Host al Contenedor
      - /etc/letsencrypt:/etc/nginx/ssl:ro

volumes:
  postgres_data:
  redis_data:
