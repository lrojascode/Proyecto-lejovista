services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-lejovista}
      POSTGRES_USER: ${DB_USER:-lejovista}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-localpassword123}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${DB_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-lejovista} -d ${DB_NAME:-lejovista}"]
      interval: 5s
      timeout: 5s
      retries: 5
    mem_limit: 512m
    cpus: 1.0

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-localredispassword123} --maxmemory 256mb
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD:-localredispassword123} ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 5
    mem_limit: 320m
    cpus: 0.5

  backend:
    # Se construye UNA sola imagen; los workers y beat la reutilizan (image:).
    build: ./backend
    image: proyectolejovista-backend:local
    # --reload local (el CMD del Dockerfile no lo trae, es apto para prod).
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file: .env
    # Monta el código del host: el reload/watchfiles refleja los cambios sin
    # reconstruir la imagen. El venv vive en /opt/venv, fuera de /app.
    volumes:
      - ./backend:/app
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/').status==200 else 1)\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    mem_limit: 512m
    cpus: 1.0

  # I-2: colas dedicadas. Antes un único worker/cola atendía sync + IA + creación de
  # campañas; con P-2 real haciendo ~12-15 llamadas a Meta por sync, un pico de syncs
  # podía retrasar la ejecución de acciones de IA o la creación de campañas. Cada
  # worker atiende solo su cola (ver task_routes en app/workers/celery_app.py).
  celery-worker-sync:
    image: proyectolejovista-backend:local
    command: watchfiles "celery -A app.workers worker -Q sync --loglevel=info --concurrency=2 --hostname=sync@%h" app
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file: .env
    volumes:
      - ./backend:/app
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.workers inspect ping -d sync@$$HOSTNAME || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    mem_limit: 384m
    cpus: 0.75

  celery-worker-ai:
    image: proyectolejovista-backend:local
    command: watchfiles "celery -A app.workers worker -Q ai --loglevel=info --concurrency=1 --hostname=ai@%h" app
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file: .env
    volumes:
      - ./backend:/app
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.workers inspect ping -d ai@$$HOSTNAME || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    mem_limit: 256m
    cpus: 0.5

  celery-worker-creation:
    image: proyectolejovista-backend:local
    command: watchfiles "celery -A app.workers worker -Q creation,celery --loglevel=info --concurrency=1 --hostname=creation@%h" app
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file: .env
    volumes:
      - ./backend:/app
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.workers inspect ping -d creation@$$HOSTNAME || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    mem_limit: 256m
    cpus: 0.5

  celery-beat:
    image: proyectolejovista-backend:local
    command: celery -A app.workers beat --loglevel=info --schedule=/tmp/celerybeat-schedule
    restart: unless-stopped
    depends_on:
      celery-worker-sync:
        condition: service_started
      celery-worker-ai:
        condition: service_started
      celery-worker-creation:
        condition: service_started
    env_file: .env
    volumes:
      - ./backend:/app
    mem_limit: 256m
    cpus: 0.25

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://api.localhost}
        NEXT_PUBLIC_BASE_DOMAIN: ${NEXT_PUBLIC_BASE_DOMAIN:-localhost}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-ws://localhost:8000}
        NEXT_PUBLIC_SINGLE_HOST_MODE: ${NEXT_PUBLIC_SINGLE_HOST_MODE:-false}
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_BASE_DOMAIN: ${NEXT_PUBLIC_BASE_DOMAIN:-localhost}
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3000}:3000"
    mem_limit: 512m
    cpus: 1.0

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    depends_on:
      - frontend
      - backend
    ports:
      - "${NGINX_PORT:-80}:80"
      - "${NGINX_SSL_PORT:-443}:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/conf.d/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    mem_limit: 128m
    cpus: 0.5

volumes:
  postgres_data:
  redis_data:
