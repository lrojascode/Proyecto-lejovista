# Override para exponer LejoVista detrás de un túnel (ngrok/Cloudflare Tunnel)
# con un solo hostname público. Uso:
#
#   docker compose -f docker-compose.yml -f docker-compose.tunnel.yml up -d --build
#
# No modifica docker-compose.yml ni se activa solo — hace falta pasar
# explícitamente el -f de este archivo. Requiere en el .env:
#   NEXT_PUBLIC_WS_URL=wss://<tu-hostname-de-tunel>
#   NEXT_PUBLIC_SINGLE_HOST_MODE=true
#   TUNNEL_ORIGIN_REGEX=^https://<tu-hostname-de-tunel-escapado>$
#   ENABLE_API_DOCS=false
#
# Ver HANDOFF.md / posibles-mejoras.md para el detalle de por qué se eligió
# ruteo por path en vez de subdominios (ngrok gratis no da subdominios
# comodín) y los pasos operativos completos.
services:
  frontend:
    build:
      args:
        NEXT_PUBLIC_SINGLE_HOST_MODE: ${NEXT_PUBLIC_SINGLE_HOST_MODE:-true}

  nginx:
    # docker compose fusiona `volumes:` por path de destino dentro del
    # contenedor: como el compose base ya monta
    # ./nginx/conf.d/default.conf -> /etc/nginx/conf.d/default.conf, apuntar
    # este MISMO destino a tunnel.conf lo reemplaza limpio, sin duplicar el
    # montaje de directorio completo (que cargaría default.conf Y tunnel.conf
    # a la vez y nginx fallaría por dos server{} con default_server).
    volumes:
      - ./nginx/conf.d-tunnel/tunnel.conf:/etc/nginx/conf.d/default.conf:ro
