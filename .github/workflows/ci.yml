name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  # Valores de test (no secretos reales) — mismos que backend/conftest.py.
  SECRET_KEY: ci-secret-key-solo-para-pruebas-1234567890
  ENCRYPTION_KEY: sHEU494awg7HtPuuIPg989QiYv0fUh0_kdmnGVa31N8=
  MOCK_SERVICES: "true"
  ENABLE_META_WRITEBACK: "false"

jobs:
  # Spec 14, criterio 4: lint, tipos, pruebas, migraciones sobre PostgreSQL y
  # construcción de imágenes ocurren en ESTA ejecución. Antes la construcción
  # vivía en otro workflow, disparado después: un CI verde describía un artefacto
  # que todavía no existía.
  coherencia:
    name: Coherencia (paridad, límites, migraciones)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias de verificación
        run: pip install -r backend/requirements-dev.txt

      # Spec 08: la version de Meta tiene que estar alineada en el codigo, el
      # ejemplo de entorno, la plantilla de despliegue y la documentacion.
      # Alinearla una vez no arregla nada: lo que lo arregla es que la
      # construccion falle cuando se desalinea.
      - name: Versión de Meta alineada
        run: python backend/scripts/verificar_version_meta.py

      # Spec 14, criterios 1, 5, 6 y 15: las versiones y el gestor de paquetes
      # que declara CI son los mismos que construyen la imagen y los mismos que
      # levanta el stack local.
      - name: Paridad entre CI, local y producción
        run: python backend/scripts/verificar_paridad.py

      # Spec 14, criterios 17 y 18.
      - name: Límites de recursos declarados
        run: python backend/scripts/verificar_limites_de_recursos.py

      # Spec 14, criterio 10: ninguna migración impide volver a la imagen
      # anterior sin declararlo.
      - name: Migraciones compatibles hacia atrás
        run: python backend/scripts/verificar_migraciones_compatibles.py

  backend:
    name: Backend (motor de producción)
    runs-on: ubuntu-latest
    # Spec 14, criterios 1 y 3. Las versiones mayores son las de producción y las
    # verifica `verificar_paridad.py`. Redis existe aquí porque el comportamiento
    # de fallo cerrado que definen las specs 01 y 13 no se puede probar sin poder
    # apuntar a un almacén que sí responde y luego a uno que no.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: lejovista
          POSTGRES_PASSWORD: localpassword123
          POSTGRES_DB: lejovista
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      # Librerías nativas de WeasyPrint (5.3, F-3.2) — mismas que backend/Dockerfile.
      - name: Install system dependencies (WeasyPrint)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libpango-1.0-0 libpangocairo-1.0-0 libcairo2 libgdk-pixbuf-2.0-0

      - name: Install Python dependencies
        working-directory: backend
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      # Solo los fallos que son errores de verdad; el conjunto de reglas y el
      # porqué están en backend/ruff.toml.
      - name: Lint
        working-directory: backend
        run: ruff check app scripts tests conftest.py alembic

      # La cadena de migraciones aplica limpia sobre el motor de producción, y
      # es la base sobre la que corre la suite después.
      - name: Alembic sobre PostgreSQL
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://lejovista:localpassword123@localhost:5432/lejovista
        run: alembic upgrade head

      # UTF8 explícito, no heredado. Una base en SQL_ASCII acepta casi todo y
      # revienta en el primer texto con un carácter fuera de ASCII —una raya en
      # un mensaje de error de Meta alcanza— con un error que no se parece en
      # nada a su causa. `conftest.py` además lo comprueba al arrancar.
      - name: Crear las bases de la suite
        env:
          PGPASSWORD: localpassword123
        run: |
          psql -h localhost -U lejovista -d lejovista -c "CREATE DATABASE suite ENCODING 'UTF8';"
          psql -h localhost -U lejovista -d lejovista -c "CREATE DATABASE concurrencia ENCODING 'UTF8';"

      # Spec 14, criterio 2. La suite entera contra PostgreSQL: el dialecto, las
      # claves foráneas, las restricciones únicas y las carreras se comportan
      # como en producción. Las pruebas de concurrencia usan su propia base
      # porque crean y destruyen el esquema por su cuenta.
      - name: Pruebas contra PostgreSQL
        working-directory: backend
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://lejovista:localpassword123@localhost:5432/suite
          TEST_POSTGRES_URL: postgresql+asyncpg://lejovista:localpassword123@localhost:5432/concurrencia
          TEST_REDIS_URL: redis://localhost:6379/9
          REDIS_URL: redis://localhost:6379/9
        run: pytest -q --cov=app --cov-report=term-missing --cov-fail-under=80

  backend-sqlite:
    name: Backend (motor embebido)
    runs-on: ubuntu-latest
    # El motor embebido se conserva porque es rápido y porque una divergencia
    # entre los dos resultados es información: dice que algo depende del motor
    # sin haberlo declarado. No sustituye al de producción; corre además.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install system dependencies (WeasyPrint)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libpango-1.0-0 libpangocairo-1.0-0 libcairo2 libgdk-pixbuf-2.0-0

      - name: Install Python dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Pruebas contra el motor embebido
        working-directory: backend
        # Sin TEST_DATABASE_URL: conftest.py cae a SQLite. REDIS_URL apunta a un
        # puerto muerto a propósito, como en run-tests.sh.
        env:
          REDIS_URL: redis://127.0.0.1:6399/0
        run: pytest -q

  frontend:
    name: Frontend (lint + typecheck + jest + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: frontend/pnpm-lock.yaml

      # Spec 14, criterio 6: `--frozen-lockfile` falla si el lockfile no
      # corresponde al manifiesto. Es la misma orden que ejecuta el Dockerfile.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm exec eslint .

      - name: Type check
        run: pnpm exec tsc --noEmit

      - name: Run tests
        # `pnpm run test -- --ci` no sirve: a diferencia de npm, pnpm reenvía el
        # `--` tal cual y jest lo toma como patrón de ruta (0 tests encontrados).
        run: pnpm exec jest --ci

      - name: Build
        run: pnpm run build

  imagenes:
    name: Imágenes (construcción, sin publicar)
    runs-on: ubuntu-latest
    # Spec 14, criterio 4. Construir aquí no publica nada: comprueba que el
    # commit que acaba de pasar las pruebas produce imágenes. Publicarlas es
    # deploy.yml, y solo después de que esto pase.
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          build-args: |
            GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: false
          build-args: |
            GIT_SHA=${{ github.sha }}
            NEXT_PUBLIC_API_URL=https://api.example.invalid
            NEXT_PUBLIC_BASE_DOMAIN=example.invalid
            NEXT_PUBLIC_WS_URL=wss://api.example.invalid
            NEXT_PUBLIC_SINGLE_HOST_MODE=false
          cache-from: type=gha
          cache-to: type=gha,mode=max
