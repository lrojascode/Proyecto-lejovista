name: Deploy

# Se dispara cuando el workflow "CI" (ci.yml) termina en main. Así el build de
# imágenes solo arranca si los tests ya pasaron — no hay una segunda carrera
# de jobs comprobando lo mismo.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  build-and-push:
    name: Build & push imágenes (GHCR)
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ghcr.io/lrojascode/proyectolejovista-backend:latest
            ghcr.io/lrojascode/proyectolejovista-backend:${{ github.event.workflow_run.head_sha }}

      # Las NEXT_PUBLIC_* quedan inlinadas en el build (igual que build-push.sh) —
      # cambiar de dominio exige reconstruir esta imagen.
      - name: Build & push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          build-args: |
            NEXT_PUBLIC_API_URL=https://api.${{ vars.BASE_DOMAIN }}
            NEXT_PUBLIC_BASE_DOMAIN=${{ vars.BASE_DOMAIN }}
            NEXT_PUBLIC_WS_URL=wss://api.${{ vars.BASE_DOMAIN }}
            NEXT_PUBLIC_SINGLE_HOST_MODE=false
          tags: |
            ghcr.io/lrojascode/proyectolejovista-frontend:latest
            ghcr.io/lrojascode/proyectolejovista-frontend:${{ github.event.workflow_run.head_sha }}

  deploy:
    name: Deploy al VPS
    needs: build-and-push
    runs-on: ubuntu-latest
    env:
      DEPLOY_HOST: ${{ secrets.VPS_HOST || secrets.SSH_HOST }}
      DEPLOY_USER: ${{ secrets.VPS_USER || secrets.SSH_USER }}
      DEPLOY_KEY: ${{ secrets.VPS_SSH_KEY || secrets.SSH_PRIVATE_KEY }}
    # Gate manual: este Environment debe configurarse en Settings → Environments
    # con "Required reviewers" — el job queda en pausa ("Waiting for approval")
    # hasta que alguien lo apruebe desde la pestaña Actions.
    environment: production
    steps:
      - name: Validar secretos de deploy
        run: |
          test -n "$DEPLOY_HOST" || { echo "::error::Falta configurar el secret VPS_HOST (o SSH_HOST)"; exit 1; }
          test -n "$DEPLOY_USER" || { echo "::error::Falta configurar el secret VPS_USER (o SSH_USER)"; exit 1; }
          test -n "$DEPLOY_KEY" || { echo "::error::Falta configurar el secret VPS_SSH_KEY (o SSH_PRIVATE_KEY)"; exit 1; }

      - name: SSH deploy (pull + up -d)
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ env.DEPLOY_HOST }}
          username: ${{ env.DEPLOY_USER }}
          key: ${{ env.DEPLOY_KEY }}
          script: |
            set -euo pipefail
            cd ${{ vars.VPS_DEPLOY_PATH }}
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d
            docker image prune -f
