name: Deploy

# Se dispara cuando el workflow "CI" (ci.yml) termina en main. Así el build de
# imágenes solo arranca si los tests ya pasaron — no hay una segunda carrera
# de jobs comprobando lo mismo.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  build-and-push:
    name: Build & push imágenes (GHCR)
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ghcr.io/lrojascode/proyectolejovista-backend:latest
            ghcr.io/lrojascode/proyectolejovista-backend:${{ github.event.workflow_run.head_sha }}

      # Las NEXT_PUBLIC_* quedan inlinadas en el build (igual que build-push.sh) —
      # cambiar de dominio exige reconstruir esta imagen.
      - name: Build & push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          build-args: |
            NEXT_PUBLIC_API_URL=https://api.${{ vars.BASE_DOMAIN }}
            NEXT_PUBLIC_BASE_DOMAIN=${{ vars.BASE_DOMAIN }}
            NEXT_PUBLIC_WS_URL=wss://api.${{ vars.BASE_DOMAIN }}
            NEXT_PUBLIC_SINGLE_HOST_MODE=false
          tags: |
            ghcr.io/lrojascode/proyectolejovista-frontend:latest
            ghcr.io/lrojascode/proyectolejovista-frontend:${{ github.event.workflow_run.head_sha }}

  # El deploy al VPS lo gestiona AHORA Coolify, no un job SSH. Este workflow solo
  # construye y publica las imágenes en GHCR; Coolify hace el pull al redesplegar el
  # recurso lejovista (manual por ahora; se puede automatizar con un "deploy webhook"
  # de Coolify llamado como un paso extra aquí).
  #
  # Se eliminó el job "Deploy al VPS" (appleboy/ssh-action + docker compose
  # -f docker-compose.prod.yml up -d): con la migración a Coolify chocaba —
  # levantaba el stack viejo con nginx tomando 80/443, que son del proxy de Coolify.
