name: Deploy

# Se dispara cuando el workflow "CI" (ci.yml) termina en main. Así el build de
# imágenes solo arranca si los tests ya pasaron — no hay una segunda carrera
# de jobs comprobando lo mismo.
#
# Este workflow SOLO construye y publica las imágenes en GHCR. El despliegue lo
# hace Coolify: panel → recurso lejovista → IMAGE_TAG = el sha de este commit →
# "Redeploy". Flujo completo y rollback en docs/infra/deploy-runbook.md.
#
# Spec 14, criterio 7: a producción se despliega por identificador de commit. La
# etiqueta `latest` se sigue publicando como conveniencia de desarrollo, pero ya
# no es lo que se despliega: "lo último que se construyó" no es un artefacto
# identificable, y con ella un rollback no tiene a qué volver.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  build-and-push:
    name: Build & push imágenes (GHCR)
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          # GIT_SHA queda horneado en la imagen y lo publica `/version`: es lo
          # que permite comprobar DESDE FUERA qué commit está corriendo, en vez
          # de deducirlo del panel (criterio 8).
          build-args: |
            GIT_SHA=${{ github.event.workflow_run.head_sha }}
          tags: |
            ghcr.io/lrojascode/proyectolejovista-backend:latest
            ghcr.io/lrojascode/proyectolejovista-backend:${{ github.event.workflow_run.head_sha }}

      # Las NEXT_PUBLIC_* quedan inlinadas en el build (igual que build-push.sh) —
      # cambiar de dominio exige reconstruir esta imagen.
      - name: Build & push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          build-args: |
            GIT_SHA=${{ github.event.workflow_run.head_sha }}
            NEXT_PUBLIC_API_URL=https://api.${{ vars.BASE_DOMAIN }}
            NEXT_PUBLIC_BASE_DOMAIN=${{ vars.BASE_DOMAIN }}
            NEXT_PUBLIC_WS_URL=wss://api.${{ vars.BASE_DOMAIN }}
            NEXT_PUBLIC_SINGLE_HOST_MODE=false
          tags: |
            ghcr.io/lrojascode/proyectolejovista-frontend:latest
            ghcr.io/lrojascode/proyectolejovista-frontend:${{ github.event.workflow_run.head_sha }}

      # Cada imagen se publica con dos tags: `${head_sha}` inmutable, que es lo
      # que se despliega y a lo que se vuelve en un rollback, y `latest`, que
      # queda como conveniencia de desarrollo. Las imágenes anteriores NO se
      # borran: son el camino de vuelta (criterio 9), y por eso este repositorio
      # no tiene ninguna política de limpieza de paquetes en GHCR.
      - name: Resumen
        run: |
          SHA='${{ github.event.workflow_run.head_sha }}'
          {
            echo "## Imágenes publicadas"
            echo
            echo '`ghcr.io/lrojascode/proyectolejovista-backend:'"$SHA"'`'
            echo
            echo '`ghcr.io/lrojascode/proyectolejovista-frontend:'"$SHA"'`'
            echo
            echo "## Para desplegar"
            echo
            echo "1. Coolify → recurso lejovista → Environment Variables → \`IMAGE_TAG=$SHA\`"
            echo "2. Redeploy."
            echo "3. Verificar, que es parte del despliegue y no un extra:"
            echo
            echo '```bash'
            echo "COMMIT_ESPERADO=$SHA SMOKE_EMAIL=... SMOKE_PASSWORD=... \\"
            echo "  scripts/despliegue/smoke.sh https://api.lejovista.agenciakibo.com"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # El deploy al VPS lo gestiona AHORA Coolify, no un job SSH. Se eliminó el job
  # "Deploy al VPS" (appleboy/ssh-action + docker compose -f docker-compose.prod.yml
  # up -d): con la migración a Coolify chocaba — levantaba el stack viejo con nginx
  # tomando 80/443, que son del proxy de Coolify. Coolify hace el pull al redesplegar
  # el recurso lejovista (manual por ahora; automatizable con un "deploy webhook").
